# Gazebo tunnel map; odom anchor at staging pose [-1.7475895, 0.140, -90 deg].
goal:
  pose: [1.888373, 1.9475895, 90.0] # [x, y, yaw_deg] in the tunnel map frame.
  position_tolerance: 0.035
  heading_tolerance_deg: 10.0
footprint:
  front: 0.067645
  rear: 0.118073
  half_width: 0.0903
  padding: 0.01 # Collision padding around the measured rectangular body, metres.
sensors:
  base_frame: base_footprint
  z_min: 0.03
  z_max: 0.3
  range_min: 0.05
  range_max: 3.0
  angular_bins: 720
  maximum_age: 0.3
  maximum_future_stamp: 0.06
  lane_maximum_age: 0.3
  minimum_lane_pixels: 30
grid:
  bounds: [-1.0, -1.5, 3.0, 2.5]
  resolution: 0.02
  static_map:
    image: maps/autorace_gazebo.pgm
    origin: [-2.36, -0.7524105]
    quarter_turns: -1
  static_hit_exclusion_radius: 0.1
  static_occupied_threshold: 65
  dynamic_cell_size: 0.005
  mark_observations: 2 # Consecutive scans, not point count.
  clear_observations: 2
  endpoint_clear_guard_radius: 0.03
  dynamic_inflation_radius: 0.06
  dynamic_inflation_value: 64
entry:
  distance: 0.92
  obstacle_clearance: 0.3 # Entry stopping gap from the front edge of the body, metres.
  cruise_velocity: 0.04
planner:
  keep_in_rectangles: # Permitted base-centre regions; body collision is checked separately.
    - [-0.42, -0.2724105, 0.34, 0.2075895]
    - [0.12, -0.1524105, 2.08, 1.7675895]
    - [1.64, 1.5875895, 2.16, 2.0675895]
  minimum_turning_radius: 0.18
  goal_heading_tolerance: 0.1396263402 # Local rotation tolerance, radians.
  collision_check_step: 0.01
  collision_check_angle: 0.0523598776
control:
  period: 0.05
  cruise_velocity: 0.075
  entry_velocity: 0.04
  maximum_angular_velocity: 0.55
  maximum_lateral_acceleration: 0.03
  linear_acceleration: 0.15
  linear_deceleration: 0.4
  angular_acceleration: 0.55
  safety_linear_deceleration: 0.15 # Local command deceleration cap; also used by entry speed control.
  safety_angular_deceleration: 0.55 # Initial alignment deceleration.
  safety_reaction_time: 0.1 # Odom command-return age limit; also used by initial entry/alignment.
  safety_distance_margin: 0.01 # Initial entry stopping margin, metres.
  planning_stopped_linear: 0.008
  planning_stopped_angular: 0.03
  heading_gain: 0.3
profiles:
  normal: {}
  fast:
    grid:
      endpoint_clear_guard_radius: 0.0
    planner:
      goal_heading_tolerance: 0.1745329252 # Local rotation tolerance, radians.
      keep_in_rectangles: # Permitted base-centre regions; body collision is checked separately.
        - [-0.42, -0.2724105, 0.34, 0.2075895]
        - [0.12, -0.1524105, 2.08, 1.7675895]
        - [1.64, 1.5875895, 2.16, 2.1975895]
    entry:
      cruise_velocity: 0.32
    control:
      cruise_velocity: 0.32
      entry_velocity: 0.035
      maximum_angular_velocity: 1.4
      maximum_lateral_acceleration: 0.3
      linear_acceleration: 0.35
      angular_acceleration: 8.0
      safety_linear_deceleration: 0.4 # Local command deceleration cap; also used by entry speed control.
      safety_reaction_time: 0.15 # Odom command-return age limit; also used by initial entry/alignment.
