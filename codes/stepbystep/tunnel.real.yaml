# Practice tunnel: 1.820 m outer square, 0.002 m walls, 0.300 m openings.
# Map origin: nominal axle centre 0.140 m outside the entrance, facing inward.
localization:
  geometry: maps/tunnel_practice_1820.geometry.json
  entrance:
    prior_pose: [0.235, -0.022, 0.0] # Entry pose [x, y, yaw_rad]: feature search and fallback if the fit is unusable.
    cluster_distance: 0.02
    sampling_resolution: 0.002
    maximum_direction_error_deg: 45.0
    fit_distance: 0.025
    minimum_points: 6
    spatial_bin_size: 0.02
    robust_distance: 0.006
  exit:
    cluster_distance: 0.04 # Connected returns may spread at a grazing wall angle.
    sampling_resolution: 0.002
    minimum_points: 6
    minimum_wall_span: 0.04
    robust_distance: 0.006
    fit_distance: 0.012
    spatial_bin_size: 0.02
    maximum_width_error: 0.02 # Measured endpoint-pair agreement, not added body clearance.
  observation_window: 1.0
  height_band: [0.04, 0.23]
  tracking_period: 0.20 # Moving wall alignment in a separate worker; 0 disables it.
  tracking_max_translation: 0.30 # Wall-fit search and maximum correction, metres.
  tracking_max_yaw_deg: 15.0
  wall_fit:
    maximum_rms: 0.020
    minimum_wall_span: 0.10
  exit_tracking_max_translation: 0.08
  exit_tracking_max_yaw_deg: 6.0
odometry:
  linear_scale: 2.893939393939394 # Multiply input odom XY and linear speed; divide tunnel linear commands.
  angular_command_scale: 3.3 # Divide tunnel angular commands; measured IMU yaw/rate are unchanged.
goal:
  pose: [1.808, 1.868, 90.0] # [x, y, yaw_deg] in the tunnel map frame.
  approach_distance: 0.188 # First goal: opening centre, this far inside; then plan to pose.
  approach_velocity: 0.2 # Forward speed target near the inside goal, before command scaling.
  approach_slowdown_distance: 0.2 # Begin lowering the speed target this far from the inside goal, metres.
  exit_alignment_angular_velocity: 1.2 # Pivot speed for the first outside route, rad/s before command scaling.
  position_tolerance: 0.035
  heading_tolerance_deg: 10.0
  exit_crossing: # Hand off after the entire body crosses this opening outward.
    - [1.658, 1.668]
    - [1.958, 1.668]
footprint:
  front: 0.0678
  rear: 0.118073
  half_width: 0.0903
  padding: 0.0 # Use the measured body dimensions without added padding.
  parts: # [xmin, ymin, xmax, ymax] in base_footprint, metres.
    - [-0.118073, -0.0611, 0.067645, 0.0611] # Chassis.
    - [-0.04775, 0.0611, 0.04775, 0.0903] # Left wheel and protruding fasteners.
    - [-0.04775, -0.0903, 0.04775, -0.0611] # Right wheel and protruding fasteners.
    - [0.033525, -0.021, 0.0678, 0.021] # Camera projection at its mounted pitch.
sensors:
  base_frame: base_footprint
  livox_particle_filter: true # Reject non-normal particle-confidence tags (bits 2..3).
  livox_motion_compensation: true # Transform each point using its acquisition timestamp.
  horizontal_half_angle_deg: 0.5 # LiDAR-plane angle filter before transforms; replaces the ground-height band.
  z_min: 0.03
  z_max: 0.22
  range_min: 0.05
  range_max: 3.0
  angular_bins: 720
  maximum_age: 0.3 # Background wall-fit result age, seconds.
  maximum_future_stamp: 0.06
  lane_maximum_age: 0.3
  minimum_lane_pixels: 30
grid:
  bounds: [-0.5, -0.4, 2.4, 2.2]
  resolution: 0.02
  static_map:
    image: maps/tunnel_practice_1820.pgm
    geometry: maps/tunnel_practice_1820.geometry.json
    origin: [-0.5, -0.4]
    quarter_turns: 0
  static_hit_exclusion_radius: 0.1
  static_occupied_threshold: 65
  dynamic_cell_size: 0.005
  mark_observations: 2 # Hit scans per subcell; unobserved scans retain evidence.
  clear_observations: 2
  endpoint_clear_guard_radius: 0.0
  dynamic_inflation_radius: 0.06
  dynamic_inflation_value: 64
entry:
  distance: 0.92
  obstacle_clearance: 0.6 # Entry stopping gap from the front edge of the body, metres.
  obstacle_half_width: 0.0903
  obstacle_right_width: 0.0903
  obstacle_left_far_width: 0.3 # Left half-width at the far end of the entry obstacle-check trapezoid.
  obstacle_check_distance: 0.8 # Forward reach from the front bumper, metres.
  cruise_velocity: 0.3
  linear_acceleration: 0.2
  heading_offset_deg: 5.0 # Initial left pivot; entry then holds the reached heading.
  alignment_angular_velocity: 1.2
  alignment_angular_acceleration: 1.0
  maximum_curvature: 0.35
planner:
  keep_in_rectangles: # Permitted base-centre regions; body collision is checked separately.
    - [-0.42, -0.15, 0.34, 0.15]
    - [0.142, -0.15, 1.958, 1.666]
    - [1.658, 1.488, 1.958, 2.068]
  minimum_turning_radius: 0.18
control:
  period: 0.05
  cruise_velocity: 0.4
  entry_velocity: 0.04
  maximum_angular_velocity: 1.4
  maximum_lateral_acceleration: 0.3
  linear_acceleration: 0.25
  linear_deceleration: 0.4
  angular_acceleration: 8.0
  safety_linear_deceleration: 0.15 # Local command deceleration cap; also used by entry speed control.
  safety_reaction_time: 0.1 # Reaction time used by straight entry only.
  safety_distance_margin: 0.01 # Initial entry stopping margin, metres.
  planning_stopped_linear: 0.008
  planning_stopped_angular: 0.03
  heading_gain: 0.3
profiles:
  normal: {}
