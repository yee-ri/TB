# Competition template: wall coordinates and goal must be surveyed before use.
goal:
  pose: [null, null, null] # [x, y, yaw_deg] in the tunnel map frame.
  position_tolerance: 0.035
  heading_tolerance_deg: 10.0
footprint:
  front: 0.0678
  rear: 0.118073
  half_width: 0.0903
  padding: 0.0 # Use the measured body dimensions without added padding.
  parts: # [xmin, ymin, xmax, ymax] in base_footprint, metres.
    - [-0.118073, -0.0611, 0.067645, 0.0611] # Chassis.
    - [-0.04775, 0.0611, 0.04775, 0.0903] # Left wheel and protruding fasteners.
    - [-0.04775, -0.0903, 0.04775, -0.0611] # Right wheel and protruding fasteners.
    - [0.033525, -0.021, 0.0678, 0.021] # Camera projection at its mounted pitch.
sensors:
  base_frame: base_footprint
  z_min: 0.03
  z_max: 0.3
  range_min: 0.05
  range_max: 3.0
  angular_bins: 720
  maximum_age: 0.3 # Initial wall alignment and background wall-fit result age, seconds.
  maximum_future_stamp: 0.06
  lane_maximum_age: 0.3
  minimum_lane_pixels: 30
grid:
  bounds: [null, null, null, null]
  resolution: 0.02
  static_map:
    image: null
    origin: [null, null]
    quarter_turns: null
  static_hit_exclusion_radius: 0.1
  static_occupied_threshold: 65
  dynamic_cell_size: 0.005
  mark_observations: 2 # Hit scans per subcell; unobserved scans retain evidence.
  clear_observations: 2
  endpoint_clear_guard_radius: 0.0
  dynamic_inflation_radius: 0.06
  dynamic_inflation_value: 64
entry:
  distance: null
  obstacle_clearance: 0.3 # Entry stopping gap from the front edge of the body, metres.
  cruise_velocity: 0.04
planner:
  keep_in_rectangles: null # Permitted base-centre regions; body collision is checked separately.
  minimum_turning_radius: 0.18
  collision_check_step: 0.01
  collision_check_angle: 0.0523598776
control:
  period: 0.05
  cruise_velocity: 0.075
  entry_velocity: 0.04
  maximum_angular_velocity: 0.55
  maximum_lateral_acceleration: 0.03
  linear_acceleration: 0.15
  linear_deceleration: 0.4
  angular_acceleration: 0.55
  safety_linear_deceleration: 0.15 # Local command deceleration cap; also used by entry speed control.
  safety_reaction_time: 0.1 # Reaction time used by straight entry only.
  safety_distance_margin: 0.01 # Initial entry stopping margin, metres.
  planning_stopped_linear: 0.008
  planning_stopped_angular: 0.03
  heading_gain: 0.3
profiles:
  normal: {}
